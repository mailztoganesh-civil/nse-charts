<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NSE Charts</title>
<meta name="description" content="Candlestick charts for NSE-listed stocks." />
<meta name="theme-color" content="#0B0F14" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">NSE</span><span class="brand-word">Charts</span>
  </div>

  <button id="prevSymbol" class="icon-btn nav-arrow" title="Previous stock" aria-label="Previous stock">‹</button>

  <div class="symbol-search">
    <input id="symbolInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
           placeholder="Any NSE symbol — e.g. RELIANCE, TCS, INFY" aria-label="NSE symbol" />
    <div id="suggestions" class="suggestions" role="listbox"></div>
  </div>

  <button id="nextSymbol" class="icon-btn nav-arrow" title="Next stock" aria-label="Next stock">›</button>

  <button id="watchToggle" class="icon-btn" title="Add to a watchlist" aria-label="Add to a watchlist">☆</button>
</header>

<section class="quote-strip" id="quoteStrip" aria-live="polite">
  <span class="quote-symbol" id="quoteSymbol">—</span>
  <span class="quote-price" id="quotePrice">—</span>
  <span class="quote-change" id="quoteChange">—</span>
  <span class="quote-meta" id="quoteMeta"></span>
</section>

<nav class="ranges" id="ranges">
  <button data-range="1d" data-interval="1m">1m</button>
  <button data-range="5d" data-interval="5m">5m</button>
  <button data-range="1mo" data-interval="15m">15m</button>
  <button data-range="1mo" data-interval="30m">30m</button>
  <button data-range="3mo" data-interval="60m">1H</button>
  <button data-range="1y" data-interval="1d" class="active">D</button>
  <button data-range="5y" data-interval="1wk">W</button>
  <button data-range="max" data-interval="1mo">M</button>
</nav>

<nav class="indicators" id="indicators">
  <button data-ind="volume" class="active"><span class="dot dot-volume"></span>Volume</button>
  <button data-ind="ma20" class="active"><span class="dot dot-ma20"></span>MA20</button>
  <button data-ind="ma50"><span class="dot dot-ma50"></span>MA50</button>
</nav>

<main class="chart-wrap">
  <div id="chart"></div>
  <div id="chartStatus" class="chart-status"></div>
  <div id="staleBanner" class="stale-banner hidden"></div>
</main>

<section class="watchlist" id="watchlistSection">
  <div class="watchlist-tabs" id="watchlistTabs"></div>
  <ul id="watchlistItems"></ul>
</section>

<footer class="datasrc">
  Data via Yahoo Finance (delayed). For reference only — not investment advice.
</footer>

<div class="modal-overlay hidden" id="watchlistModal">
  <div class="modal">
    <h3 id="modalTitle">Add to watchlist</h3>
    <div id="modalListRows" class="modal-rows"></div>
    <div class="modal-new-row">
      <input id="modalNewListName" type="text" placeholder="New watchlist name" autocomplete="off" />
      <button id="modalCreateBtn">Create</button>
    </div>
    <button id="modalDoneBtn" class="modal-done">Done</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
